apiVersion: 1
groups:
  - orgId: 1
    name: vinci-alert-rules
    folder: EduMind-Vinci
    interval: 1m
    rules:
      - uid: vinci-error-rate-high
        title: Vinci Error Rate High
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: |
                sum(rate({app="edumind-backend"} |= "app.analytics.telemetry" |= "\"module\": \"vinci\"" |= "\"status\": \"error\"" [5m]))
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: loki
            model:
              expr: |
                sum(rate({app="edumind-backend"} |= "app.analytics.telemetry" |= "\"module\": \"vinci\"" [5m]))
              intervalMs: 60000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A / B
              type: math
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Vinci error rate > 15%
          runbook_url: https://github.com/yjy-yjy-yuan/edumind-backend/blob/main/docs/VINCI_RUNBOOK.md
        labels:
          service: vinci
          severity: warning
      - uid: vinci-timeout-rate-high
        title: Vinci Timeout Rate High
        condition: C
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: |
                sum(rate({app="edumind-backend"} |= "app.analytics.telemetry" |= "\"module\": \"vinci\"" |= "\"status\": \"timeout\"" [5m]))
          - refId: B
            datasourceUid: loki
            model:
              expr: |
                sum(rate({app="edumind-backend"} |= "app.analytics.telemetry" |= "\"module\": \"vinci\"" [5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              expression: A / B
              type: math
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: Vinci timeout rate > 10%
          runbook_url: https://github.com/yjy-yjy-yuan/edumind-backend/blob/main/docs/VINCI_RUNBOOK.md
        labels:
          service: vinci
          severity: warning
      - uid: vinci-degraded-burst
        title: Vinci Degraded Burst
        condition: A
        data:
          - refId: A
            datasourceUid: loki
            model:
              expr: |
                sum(count_over_time({app="edumind-backend"} |= "app.analytics.telemetry" |= "\"module\": \"vinci\"" |= "\"status\": \"degraded\"" [10m]))
        noDataState: NoData
        execErrState: Error
        for: 0m
        annotations:
          summary: Vinci degraded events exceed burst threshold
          runbook_url: https://github.com/yjy-yjy-yuan/edumind-backend/blob/main/docs/VINCI_RUNBOOK.md
        labels:
          service: vinci
          severity: warning
